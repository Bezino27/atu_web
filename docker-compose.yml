version: "3.9"

services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://host.docker.internal:8000/api
    container_name: atu_frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://host.docker.internal:8000/api
