services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: https://atukosice.sk/api
        NEXT_PUBLIC_CLIENT_API_URL: https://atukosice.sk/api
        NEXT_PUBLIC_MEDIA_ORIGIN: https://atukosice.sk
    container_name: atu_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://atukosice.sk/api
      NEXT_PUBLIC_CLIENT_API_URL: https://atukosice.sk/api
      NEXT_PUBLIC_MEDIA_ORIGIN: https://atukosice.sk