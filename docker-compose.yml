services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://atukosice.sk:8000/api
        NEXT_PUBLIC_MEDIA_ORIGIN: http://atukosice.sk:8000
    container_name: atu_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://atukosice.sk:8000/api
      NEXT_PUBLIC_MEDIA_ORIGIN: http://atukosice.sk:8000
